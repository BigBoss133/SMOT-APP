name: Build Windows
on:
  push:
    branches: [installer]
    tags: ['v*']
  pull_request:
    branches: [installer]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: cd smot-desktop && npm install
      - name: Build app
        run: cd smot-desktop && npm run tauri build
      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: smot-windows-setup
          path: smot-desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: smot-windows-msi
          path: smot-desktop/src-tauri/target/release/bundle/msi/*.msi
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            smot-desktop/src-tauri/target/release/bundle/nsis/*.exe
            smot-desktop/src-tauri/target/release/bundle/msi/*.msi

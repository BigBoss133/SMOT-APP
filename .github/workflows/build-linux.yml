name: Build Linux
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: cd smot-desktop && npm install
      - name: Build app
        run: cd smot-desktop && npm run tauri build
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: smot-linux-appimage
          path: smot-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: smot-linux-deb
          path: smot-desktop/src-tauri/target/release/bundle/deb/*.deb
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            smot-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            smot-desktop/src-tauri/target/release/bundle/deb/*.deb
